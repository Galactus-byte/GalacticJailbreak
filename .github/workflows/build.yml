name: Build GalacticJailbreak IPA

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          brew install xcodegen ldid

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project GalacticJailbreak.xcodeproj \
            -scheme GalacticJailbreak \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/GalacticJailbreak.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            2>&1 | tee build.log || (grep "error:" build.log && exit 1)

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package & Sign IPA with Entitlements
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/GalacticJailbreak.xcarchive/Products/Applications/GalacticJailbreak.app \
            build/ipa/Payload/
          ldid -SEntitlements.plist build/ipa/Payload/GalacticJailbreak.app/GalacticJailbreak || true
          cd build/ipa
          zip -r ../GalacticJailbreak.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GalacticJailbreak-${{ github.sha }}
          path: build/GalacticJailbreak.ipa
          retention-days: 30
