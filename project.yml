name: GalacticJailbreak
options:
  bundleIdPrefix: io.galactic
  deploymentTarget:
    iOS: "15.0"
settings:
  SWIFT_VERSION: "5.9"
  ENABLE_BITCODE: NO
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGNING_ALLOWED: NO
targets:
  GalacticJailbreak:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GalacticJB
        CFBundleIdentifier: io.galactic.jailbreak
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.galactic.jailbreak
      SWIFT_VERSION: "5.9"
      ENABLE_BITCODE: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_OBJC_BRIDGING_HEADER: Sources/GalacticJailbreak-Bridging-Header.h
